name: CI

on:
  push:
    branches: [master]
    tags: ["v*"]
  pull_request:

jobs:
  py-tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install -r requirements.txt
      - run: python -m compileall -q core main.py webui.py tests
      - name: unit tests
        shell: bash
        run: |
          fail=0
          for f in tests/test_*.py; do
            echo "== $f"
            python -X utf8 "$f" || fail=1
          done
          exit $fail

  web-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm ci
        working-directory: web
      - run: npm run build
        working-directory: web

  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: build image
        run: docker build --build-arg PIP_INDEX_URL=https://pypi.org/simple -t fare-alert:ci .

  docker-publish:
    if: github.event_name == 'push' && (github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: compute image tags
        id: t
        shell: bash
        run: |
          {
            echo "tags<<EOF"
            echo "ghcr.io/${{ github.repository }}:latest"
            echo "ghcr.io/${{ github.repository }}:${{ github.sha }}"
            if [[ "$GITHUB_REF" == refs/tags/* ]]; then
              echo "ghcr.io/${{ github.repository }}:${GITHUB_REF#refs/tags/}"
            fi
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: .
          build-args: PIP_INDEX_URL=https://pypi.org/simple
          push: true
          tags: ${{ steps.t.outputs.tags }}

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: create github release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
